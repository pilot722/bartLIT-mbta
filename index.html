.alert-banner-wrap{padding:12px 14px 0;}
.alert-banner{display:inline-block;padding:6px 12px;border-radius:3px;font-size:12px;line-height:1.2;color:#fff;font-weight:800;letter-spacing:.035em;}
.alert-banner-wrap .alert-banner{margin:0 4px 4px 0;max-width:100%;}
.alert-banner-wrap .alert-dates{background:#334e65;color:#fff;text-transform:none;}
.alert-banner-wrap .alert-active{background:#fff3b0;color:#263d51;text-transform:none;}
.alert-banner-wrap .alert-stops{background:#e5ebf0;color:#334b61;text-transform:none;}
.alert-body{padding:10px 14px 14px;}
.alert-panel .alert-head{line-height:1.42;}
.alert-panel .alert-more{background:#fff;border-top:1px solid #d8e0e6;}
@media screen and (min-width:761px){
 .alert-panel .alert-heading{padding:12px 15px 12px;}
 .alert-panel .alert-title{font-size:17px;margin-bottom:4px;}
 .alert-panel .alert-sub{font-size:11px;}
 .alert-panel .alert-list{padding:9px 10px 1px;max-height:calc(100vh - 195px);overflow-y:auto;-webkit-overflow-scrolling:touch;}
 .alert-panel .alert-item{margin-bottom:9px;padding:0;}
 .alert-banner-wrap{padding:9px 11px 0;}
 .alert-banner{font-size:11px;padding:5px 10px;}
 .alert-body{padding:8px 11px 11px;}
 .alert-panel .alert-more{padding:9px 12px;}
}


/* iOS 10 landscape sizing guard and long countdown labels. */
html,body{ -webkit-text-size-adjust:100%; text-size-adjust:100%; }
.count{box-sizing:border-box;overflow:hidden;white-space:nowrap;}
.count .num{display:block;white-space:nowrap;max-width:100%;}
@media screen and (min-width:761px){
  /* Keep the two columns within the iPad viewport without flexible overflow. */
  .groups{width:100%;max-width:100%;}
  .arrivals-column{min-width:0;box-sizing:border-box;}
  .groups>.alert-panel{min-width:0;box-sizing:border-box;}
  .arrivals-column .bus-arrival,.group:first-child .train-arrivals .bus-arrival{min-width:0;}
  .arrivals-column .arrival-info,.group:first-child .train-arrivals .arrival-info{min-width:0;}
  .arrivals-column .count{
    min-width:75px;-webkit-flex:0 0 auto;flex:0 0 auto;
    margin-left:6px;padding-left:7px;
  }
  .arrivals-column .count .num{font-size:25px;letter-spacing:0;}
  .arrivals-column .count .num.is-now{font-size:19px;letter-spacing:0;}
}


/* Matched, nested panels for iPad landscape; all rules Safari 10-compatible */
.groups{display:-webkit-flex;display:flex;-webkit-align-items:stretch;align-items:stretch;}
.arrivals-panel{
  display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;
  background:#eef2f5;border:1px solid var(--line);border-radius:4px;
  overflow:hidden;box-shadow:0 2px 4px rgba(15,49,83,.08);
}
.arrivals-heading{background:var(--panel-heading);color:#fff;padding:13px 16px;border-bottom:1px solid #315673;}

.arrivals-panel-title{color:#fff;font-size:17px;font-weight:800;line-height:1.2}
.arrivals-heading .status{font-size:11px;text-align:left;margin-top:4px;}
.arrivals-heading .status.error{color:#ffd5d0;}
.arrivals-content{padding:11px 12px 3px;-webkit-flex:1 1 auto;flex:1 1 auto;}
.arrivals-panel .group{margin-bottom:11px;}
.arrivals-panel .group h2{border-radius:3px 3px 0 0;margin:0;}
.arrivals-panel .group h2:before{display:none;}
.arrivals-panel .card,.arrivals-panel .destination-card{border-radius:0 0 3px 3px;box-shadow:none;}
.arrivals-footer{border-top:1px solid #d8e0e6;background:#fff;padding:10px 12px;display:flex;-webkit-align-items:center;align-items:center;}
.arrivals-footer .legend{flex:1 1 auto;min-width:0;margin:0;gap:0;-webkit-align-items:baseline;align-items:baseline;display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;line-height:1.4;}
.arrivals-footer .legend span{display:inline-block;margin-right:6px;white-space:nowrap;}
.arrivals-footer .legend i{display:inline-block;vertical-align:middle;margin-right:6px;}
.arrivals-footer .refresh-caption{flex:0 0 auto;margin-left:8px;font-size:11px;color:var(--muted);white-space:nowrap;}
.groups>.alert-panel{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;align-self:stretch;}
.alert-panel .alert-list{-webkit-flex:1 1 auto;flex:1 1 auto;}
.alert-panel .alert-more{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:space-between;justify-content:space-between;flex-wrap:wrap;}
.alert-more .refresh-caption{white-space:nowrap;}
@media screen and (min-width:761px){
 .arrivals-column{padding-right:0;margin-right:14px;width:calc(43% - 14px);-webkit-flex:0 0 calc(43% - 14px);flex:0 0 calc(43% - 14px);}
 .groups>.alert-panel{width:57%;-webkit-flex:0 0 57%;flex:0 0 57%;}
 .arrivals-heading{padding:11px 14px;}
 .arrivals-panel-title{font-size:17px;}
 .arrivals-content{padding:9px 10px 1px;}
 .arrivals-panel .group{margin-bottom:9px;}
 .arrivals-footer,.alert-panel .alert-more{min-height:45px;padding:8px 10px;font-size:10px;line-height:1.4;}
 .arrivals-footer .legend,.arrivals-footer .refresh-caption{font-size:10px;}
 .alert-panel .alert-list{max-height:calc(100vh - 185px);overflow-y:auto;}
}
@media screen and (max-width:760px){
 .groups{display:block;}
 .arrivals-panel{width:100%;margin-right:0;margin-bottom:14px;}
 .groups>.alert-panel{width:100%;}
}

header .brand{gap:0;}
header .brand .t-roundel{margin-right:7px;}
@media(max-width:650px){header .brand .t-roundel{margin-right:5px;}}
header .header-primary{margin:0;font-size:30px;font-weight:750;line-height:1.04;letter-spacing:-.035em;}
