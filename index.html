<title>Bartlett Street | Arrivals</title>
<style>

.empty{background:#f7f9fb;color:var(--muted);font-size:14px;padding:25px 0;text-align:center;grid-column:1/-1}.footer{margin:27px 0;color:var(--muted);font-size:12px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}button{font:inherit;color:var(--blue);background:white;border:1px solid #9ab2c6;border-radius:3px;padding:7px 11px;cursor:pointer;font-weight:700}a{color:var(--blue)}.error{color:#ae342c}.setup{background:#fff5de;border:1px solid #d6b164;color:#805713;padding:12px;border-radius:4px;margin-bottom:15px;font-size:13px;display:none}

<body><main><header><div class="brand"><svg class="t-roundel" viewBox="0 0 64 64" role="img" aria-label="T roundel" xmlns="http://www.w3.org/2000/svg"><circle cx="32" cy="32" r="29.3" fill="#fff" stroke="#111" stroke-width="2.8"/><path d="M11.8 17.7H52.2V27.9H37.1V52.6H26.9V27.9H11.8Z" fill="#111"/></svg><div><div class="sub">Bartlett Street <span class="sub-dot">·</span> Somerville</div><h1>Arrivals</h1></div></div><div class="header-meta"><div class="date" id="date">—</div><div class="clock" id="clock">--:--</div><div class="status" id="status"><span class="dot"></span> Connecting…</div></div></header><div class="setup" id="notice"></div><div class="groups" id="groups"></div><div class="footer"><span>Live MBTA predictions · refreshed every 30 seconds · walking times are approximate</span><span><button id="retry">Refresh now</button> · <a href="https://www.mbta.com/" target="_blank" rel="noopener">MBTA</a></span></div></main>
<script>
'use strict';
const API='https://api-v3.mbta.com';
const CACHE='bartlit_destinations_v5';
const STOP_RULES=[
 {route:'88',match:/^highland ave @ central st$/i,dir:'davis',walk:9,jog:6},
 {route:'90',match:/^highland ave @ central st$/i,dir:'davis',walk:9,jog:6},
 {route:'90',match:/^highland ave @ central st$/i,dir:'sullivan',walk:9,jog:6},
 {route:'89',match:/^broadway @ bartlett st$/i,dir:'sullivan',walk:7,jog:6}
];
const TRAIN={id:'place-mgngl',route:'Green-E',walk:9,jog:6};
let upcomingAlerts=[],alertsLoaded=false,alertsError='',alertLastFetch=0,alertNextRetry=0,alertBusy=false;
const routeDestinations={};let targets=[],predictions=[],lastSuccess=0,nextRetry=0,errorCount=0,busy=false,setupError='';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mins(t){const diff=(Date.parse(t)-Date.now())/60000;if(!Number.isFinite(diff)||diff<-.6)return null;return diff<.75?'Now':String(Math.ceil(diff));}
async function get(path){const r=await fetch(API+path,{headers:{Accept:'application/vnd.api+json'},cache:'no-store'});if(!r.ok){const e=new Error('MBTA API HTTP '+r.status);e.status=r.status;throw e;}return r.json();}
function destination(route,d){return routeDestinations[route]?.[d]||''}
function chooseDirection(route,goal){const names=routeDestinations[route]||[];
 if(route==='88'&&goal==='davis')return names.findIndex(s=>/clarendon/i.test(s));
 if(goal==='davis')return names.findIndex(s=>/davis/i.test(s));
 if(route==='90'&&goal==='sullivan')return names.findIndex(s=>/assembly|wellington|sullivan/i.test(s));
 if(goal==='sullivan')return names.findIndex(s=>/sullivan/i.test(s));
 return -1;
}
async function initialize(){
 try{const cached=JSON.parse(localStorage.getItem(CACHE)||'null');if(cached&&Date.now()-cached.at<7*86400000&&cached.targets?.length===4&&cached.routes){Object.assign(routeDestinations,cached.routes);targets=cached.targets;return;}}catch(e){}
 const results=await Promise.all([
  get('/stops?'+new URLSearchParams({'filter[route]':'88,90','page[limit]':'500'})),
  get('/stops?'+new URLSearchParams({'filter[route]':'89','page[limit]':'500'})),
  ...['88','89','90','Green-E'].map(r=>get('/routes/'+r))
 ]);
 for(let i=0;i<4;i++)routeDestinations[['88','89','90','Green-E'][i]]=results[i+2].data.attributes.direction_destinations||[];
 const stops=[...results[0].data,...results[1].data];
 targets=STOP_RULES.map(rule=>{const candidates=stops.filter(s=>rule.match.test(s.attributes?.name||''));
 const dir=chooseDirection(rule.route,rule.dir);
 // Only use stops that are served by this route in the requested direction.
 const selected=candidates.find(s=>s.relationships?.route?.data?.id===rule.route)||candidates[0];
 if(!selected||dir<0)throw new Error('Could not identify '+rule.route+' toward '+rule.dir+'; verify MBTA stop data');
 return {route:rule.route,stop:selected.id,direction:dir,goal:rule.dir,walk:rule.walk,jog:rule.jog,stopName:selected.attributes.name};
 });
 try{localStorage.setItem(CACHE,JSON.stringify({at:Date.now(),targets,routes:routeDestinations}));}catch(e){}
}
function reachClass(when,walk,jog){
 const eta=(Date.parse(when)-Date.now())/60000;
 if(!Number.isFinite(eta))return 'reachable-late';
 // One minute of cushion for crossing streets and reaching a stop.
 if(eta>=walk+1)return 'reachable-walk';
 if(eta>=jog+1)return 'reachable-jog';
 return 'reachable-late';
}
function compactText(text,max=185){
 const t=String(text||'').replace(/\s+/g,' ').trim();
 return t.length>max?t.slice(0,max-1).replace(/\s+\S*$/,'')+'…':t;
}
function stationHTML(dir){
 const list=predictions.filter(p=>p.route==='Green-E'&&p.dir===dir).sort((a,b)=>a.timestamp-b.timestamp).slice(0,2);
 const dest=destination('Green-E',dir)||(dir===0?'Heath Street':'Medford/Tufts');
 // Use the same rows and countdown styling as the bus destination cards.
 const info=`<div class="pill train">E</div><div class="arrival-info"><div class="arrival-stop">${esc(dest)}</div><div class="stop">Magoun Square</div><div class="walk-note">About ${TRAIN.walk} min walk</div></div>`;
 if(!list.length)return `<div class="destination-card train-arrivals"><div class="bus-arrival">${info}<div class="count">—<span class="unit">No predictions</span></div></div></div>`;
 return `<div class="destination-card train-arrivals">${list.map(p=>`<div class="bus-arrival">${info}<div class="count ${reachClass(p.when,TRAIN.walk,TRAIN.jog)}"><span class="num">${mins(p.when)??'—'}</span><span class="unit">${mins(p.when)==='Now'?'arriving':'min'}</span></div></div>`).join('')}</div>`;
}
function goalHTML(goal){let list=predictions.filter(p=>p.goal===goal&&mins(p.when)!==null).sort((a,b)=>a.timestamp-b.timestamp).slice(0,2);
 if(!list.length)return '<div class="empty">No upcoming predictions</div>';
 return list.map(p=>`<div class="bus-arrival"><div class="pill">${esc(p.route)}</div><div class="arrival-info"><div class="arrival-stop">${esc(destination(p.route,p.direction)|| (goal==='davis'?'Davis Square':'Sullivan Square'))}</div><div class="stop">${esc(p.stopName)}</div><div class="walk-note">About ${p.walk} min walk</div></div><div class="count ${reachClass(p.when,p.walk,p.jog)}"><span class="num">${mins(p.when)}</span><span class="unit">${mins(p.when)==='Now'?'arriving':'min'}</span></div></div>`).join('');
}

function alertDate(start){return new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}).format(new Date(start));}
function lineColor(line){
 return {'Red':'#da291c','Orange':'#ed8b00','Blue':'#003da5','Green':'#00843d'}[line]||'#526476';
}
function affectedSegment(text){
 // Only show a segment explicitly named in the MBTA alert; never infer station closures.
 const t=String(text||'').replace(/\s+/g,' ').trim();
 const m=t.match(/(?:no (?:green line |red line |orange line |blue line )?trains|(?:shuttle )?buses (?:will )?replace (?:train )?service|(?:train )?service (?:is )?suspended)[^.!?]{0,100}?between\s+([^.!?;]{3,180}?)\s+and\s+([^.!?;,]{3,90})(?=[,.;!?]|$)/i);
 if(m)return `${m[1].trim()} – ${m[2].trim()}`;
 const n=t.match(/between\s+([^.!?;]{3,110}?)\s+and\s+([^.!?;,]{3,90})(?=[,.;!?]|$)/i);
 return n?`${n[1].trim()} – ${n[2].trim()}`:'';
}
function upcomingPanel(){
 let items=upcomingAlerts.slice(0,5).map(a=>{
   const first=(a.branches||'Subway').split(' · ')[0];
   const line=first.split(' ')[0];
   const kind=a.effect==='Shuttle buses'?'Shuttle buses replacing trains':'Train service suspension';
   const segment=affectedSegment(a.fullTitle+' '+a.description);
   const source=a.fullTitle||a.title;
   return `<div class="alert-item">
     <div class="line-label"><span class="line-dot" style="background:${lineColor(line)}"></span>${esc(a.branches||'Subway')}</div>
     <div class="alert-date">${esc(alertDate(a.start))}${a.timeframe?' · '+esc(compactText(a.timeframe,55)):''}</div>
     <div class="service-label">${esc(kind)}</div>
     ${segment?`<div class="segment"><span class="segment-label">Out-of-service segment</span><strong>${esc(compactText(segment,170))}</strong></div>`:''}
     <div class="alert-head">${esc(compactText(source,220))}</div>
     ${a.description?`<details class="alert-details"><summary>Full alert and affected stops</summary><p>${esc(a.description)}</p></details>`:''}
   </div>`;
 }).join('');
 if(!items){items=`<div class="alert-empty">${!alertsLoaded?'Checking upcoming subway service changes…':alertsError?'Service updates are temporarily unavailable.':'No upcoming shuttle buses or subway suspensions reported in the next 30 days.'}</div>`;}
 return `<aside class="alert-panel" aria-label="Upcoming subway service alerts">
  <div class="alert-heading"><div class="alert-title">Upcoming Service Alerts</div><div class="alert-sub">Shuttles & suspensions · next 30 days</div></div>
  <div class="alert-list">${items}</div>
  ${upcomingAlerts.length>5?`<div class="alert-indicator">Showing 5 of ${upcomingAlerts.length} scheduled changes</div>`:''}
  <div class="alert-more"><a href="https://www.mbta.com/alerts/subway" target="_blank" rel="noopener">View all MBTA subway alerts</a></div>
 </aside>`;
}
async function updateAlerts(){
 if(alertBusy||document.hidden||Date.now()<alertNextRetry||Date.now()-alertLastFetch<600000)return;
 alertBusy=true;
 try{
  const qs=new URLSearchParams({'filter[route]':'Red,Orange,Blue,Green-B,Green-C,Green-D,Green-E','filter[lifecycle]':'UPCOMING,ONGOING_UPCOMING','page[limit]':'100'});
  const result=await get('/alerts?'+qs);
  const now=Date.now(),end=now+30*86400000;
  upcomingAlerts=(result.data||[]).flatMap(item=>{
   const a=item.attributes||{};
   if(!['SHUTTLE','SUSPENSION'].includes(a.effect))return [];
   const starts=(a.active_period||[]).map(p=>p.start).filter(Boolean).map(s=>Date.parse(s)).filter(s=>Number.isFinite(s)&&s>now&&s<=end);
   if(!starts.length)return [];
   const affectedRoutes=[...new Set((a.informed_entity||[]).map(e=>e.route).filter(Boolean))];
   const affectedLines=['Red','Orange','Blue'].filter(r=>affectedRoutes.includes(r)).map(r=>r+' Line');
   const greenBranches=affectedRoutes.filter(r=>/^Green-[BCDE]$/.test(r)).map(r=>r.slice(-1)).sort();
   if(greenBranches.length)affectedLines.push('Green Line'+(greenBranches.length<4?' ('+greenBranches.join(', ')+')':''));
   const kinds={SHUTTLE:'Shuttle buses',SUSPENSION:'Suspension'};
   return [{start:new Date(Math.min(...starts)).toISOString(),title:a.short_header||a.header||a.service_effect||'Upcoming subway service change',fullTitle:a.header||a.short_header||'',description:a.description||'',timeframe:a.timeframe||'',effect:kinds[a.effect]||'',branches:affectedLines.join(' · ')||'Subway',id:item.id}];
  }).sort((a,b)=>Date.parse(a.start)-Date.parse(b.start)).filter((a,i,array)=>array.findIndex(b=>b.id===a.id)===i);
  alertsLoaded=true;alertsError='';alertLastFetch=Date.now();alertNextRetry=0;
 }catch(e){alertsLoaded=true;alertsError=e.message||'Unable to load service alerts';alertNextRetry=Date.now()+(e.status===429?600000:120000);}
 finally{alertBusy=false;render();}
}
function render(){ $('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(new Date()); $('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'}).format(new Date());
 $('groups').innerHTML=`<div class="arrivals-column"><section class="group green-group"><h2>Green Line · Inbound</h2><div class="green-overview"><div class="cards">${stationHTML(0)}</div></div></section><section class="group bus-group"><h2>Bus · To Davis Square</h2><div class="destination-card">${goalHTML('davis')}</div></section><section class="group bus-group"><h2>Bus · To Sullivan Square</h2><div class="destination-card">${goalHTML('sullivan')}</div></section><div class="legend"><span><i style="background:#08753a"></i>Time to walk</span><span><i style="background:#d59a1c"></i>Jog needed</span><span><i style="background:#98a3ad"></i>Likely missed</span></div></div>${upcomingPanel()}`;
 const s=$('status');if(nextRetry>Date.now()){s.textContent='API paused · retry in '+Math.ceil((nextRetry-Date.now())/1000)+'s';s.className='status error';}
 else if(setupError){s.textContent=setupError;s.className='status error';}
 else if(lastSuccess){s.innerHTML=`<span class="dot"></span> Updated ${Math.floor((Date.now()-lastSuccess)/1000)}s ago`;s.className='status';}
 else{s.innerHTML='<span class="dot"></span> Connecting…';s.className='status';}
}
async function update(){if(busy||Date.now()<nextRetry||document.hidden||!targets.length)return;busy=true;
 try{const stops=[...new Set([TRAIN.id,...targets.map(t=>t.stop)])];const qs=new URLSearchParams({'filter[stop]':stops.join(','),'filter[route]':'Green-E,88,89,90','page[limit]':'300'});
 const json=await get('/predictions?'+qs);const next=[];
 for(const item of json.data){const route=item.relationships?.route?.data?.id,stop=item.relationships?.stop?.data?.id,dir=item.attributes?.direction_id,when=item.attributes?.arrival_time||item.attributes?.departure_time;
 if(!when||mins(when)===null)continue;
 if(route==='Green-E'&&dir===0)next.push({route,dir,when,timestamp:Date.parse(when)});
 for(const t of targets){if(t.route===route&&t.stop===stop&&t.direction===dir)next.push({...t,dir,when,timestamp:Date.parse(when)});}
 }
 predictions=next;lastSuccess=Date.now();nextRetry=0;errorCount=0;setupError='';
 }catch(e){errorCount++;nextRetry=Date.now()+(e.status===429?Math.min(600000,60000*2**Math.min(errorCount-1,3)):30000);if(!lastSuccess)setupError=e.message;
 }finally{busy=false;render();}
}
$('retry').addEventListener('click',()=>{nextRetry=0;update()});render();
initialize().then(update).catch(e=>{setupError=e.message;render()});updateAlerts();
setInterval(render,15000);setInterval(update,30000);setInterval(updateAlerts,600000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){update();updateAlerts();}});
</script></body></html>
