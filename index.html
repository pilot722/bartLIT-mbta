<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102e4b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Somerville | Next Arrivals</title>
<style>
:root{color-scheme:light;--blue:#165c96;--navy:#102e4b;--green:#00843d;--bus:#f2b323;--ink:#172533;--muted:#526476;--line:#d6dee5;--bg:#edf1f4}
*{box-sizing:border-box}
html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{max-width:1320px;margin:auto;padding:0 clamp(14px,2.8vw,34px) 24px}
header{margin:0 calc(-1 * clamp(14px,2.8vw,34px)) 25px;padding:21px clamp(14px,2.8vw,34px);background:var(--navy);color:white;display:flex;justify-content:space-between;align-items:center;gap:14px;border-bottom:7px solid var(--blue)}
.brand{display:flex;align-items:center;gap:16px}.t-roundel{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:white;color:#111;font-size:45px;font-weight:900;letter-spacing:-.1em;line-height:1;padding-right:5px;flex-shrink:0}
header .sub{color:#c6d8e8;font-size:12px;text-transform:uppercase;letter-spacing:.13em;font-weight:700;margin-bottom:5px}h1{font-size:clamp(27px,3.4vw,44px);margin:0;letter-spacing:-.045em;font-weight:750;line-height:1.05}
.clock{font-size:clamp(19px,2.5vw,32px);font-weight:750;text-align:right;font-variant-numeric:tabular-nums}.status{font-size:12px;color:#d1e0eb;text-align:right;margin-top:6px}.dot{display:inline-block;width:8px;height:8px;background:#58d691;border-radius:50%;margin-right:6px}
.groups{display:grid;gap:25px}.group h2{font-size:16px;color:#193e5d;text-transform:uppercase;letter-spacing:.035em;font-weight:800;margin:0 0 11px;display:flex;align-items:center;gap:10px}.group h2:before{content:"";display:block;background:var(--blue);width:7px;height:22px;flex-shrink:0}.group:first-child h2:before{background:var(--green)}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:4px;padding:19px;min-width:0;box-shadow:0 2px 4px #0f315312;border-top:5px solid var(--bus)}.group:first-child .card{border-top-color:var(--green)}
.row{display:flex;align-items:flex-start;gap:12px}.pill{min-width:54px;text-align:center;padding:9px 8px;border-radius:3px;font-size:23px;font-weight:800;line-height:1.05;background:var(--bus);color:#15191c}.pill.train{background:var(--green);color:white;border-radius:50%;min-width:48px;height:48px;padding:11px 8px;font-size:22px}
.dest{font-size:clamp(19px,2vw,25px);line-height:1.16;font-weight:750;letter-spacing:-.03em;min-width:0}.stop{color:var(--muted);font-size:13px;margin-top:5px}.walk{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:3px;background:#e8f1f8;color:#174b71;font-size:12px;font-weight:700}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}.time{background:#f7f9fb;min-height:88px;display:flex;align-items:center;justify-content:center;flex-direction:column}.time:first-child{background:#e8f1f8}.num{font-size:clamp(35px,4.2vw,58px);line-height:1;font-weight:750;letter-spacing:-.055em;font-variant-numeric:tabular-nums}.time:first-child .num{color:var(--blue)}.unit{font-size:12px;color:var(--muted);margin-top:5px;text-transform:uppercase;font-weight:700;letter-spacing:.08em}
.empty{background:#f7f9fb;color:var(--muted);font-size:14px;padding:25px 0;text-align:center;grid-column:1/-1}.footer{margin:27px 0;color:var(--muted);font-size:12px;display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}button{font:inherit;color:var(--blue);background:white;border:1px solid #9ab2c6;border-radius:3px;padding:7px 11px;cursor:pointer;font-weight:700}a{color:var(--blue)}.error{color:#ae342c}.setup{background:#fff5de;border:1px solid #d6b164;color:#805713;padding:12px;border-radius:4px;margin-bottom:15px;font-size:13px;display:none}
@media(max-width:650px){.t-roundel{width:49px;height:49px;font-size:36px}.brand{gap:10px}.cards{grid-template-columns:1fr}.card{padding:15px}.times{margin-top:14px}.time{min-height:73px}.num{font-size:42px}.status{font-size:10px}header{margin-bottom:19px}}
@media(min-width:1050px){.groups{grid-template-columns:1fr 1fr}.group:first-child{grid-column:1/-1}.group:first-child .cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>
<body><main><header><div class="brand"><div class="t-roundel" aria-label="T">T</div><div><div class="sub">Somerville · Transit Tracker</div><h1>Next Arrivals</h1></div></div><div><div class="clock" id="clock">--:--</div><div class="status" id="status"><span class="dot"></span> Connecting…</div></div></header><div class="setup" id="notice"></div><div class="groups" id="groups"></div><div class="footer"><span>Live MBTA arrival predictions · 30 sec refresh · walking times are rough estimates</span><span><button id="retry">Refresh now</button> · <a href="https://www.mbta.com/" target="_blank" rel="noopener">MBTA</a></span></div></main>
<script>
'use strict';
const API='https://api-v3.mbta.com';
const specs=[
 {route:'Green-E',group:'Green Line · Magoun Square',badge:'E',station:'Magoun Square',anchor:'place-mgngl',type:'train',walk:[9,9]},
 {route:'80',group:'Medford Street · Bartlett',badge:'80',station:'Medford St / Bartlett St',find:'bartlett',type:'bus',walk:[4,4]},
 {route:'89',group:'Broadway · Bartlett',badge:'89',station:'Broadway / Bartlett St',find:'bartlett',type:'bus',walk:[4,4]},
 {route:'88',group:'Highland Avenue · Central',badge:'88',station:'Highland Ave / Central St',find:'central st',type:'bus',walk:[14,14]},
 {route:'90',group:'Highland Avenue · Central',badge:'90',station:'Highland Ave / Central St',find:'central st',type:'bus',walk:[14,14]}
];
let metadata=new Map(),arrivals=new Map(),lastSuccess=0,inFlight=false;
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function request(path){const r=await fetch(API+path,{headers:{'Accept':'application/vnd.api+json'},cache:'no-store'});if(!r.ok)throw new Error('MBTA API: HTTP '+r.status);return r.json()}
function distance(a,b){const dx=(a.latitude-b.latitude)*111000,dy=(a.longitude-b.longitude)*82000;return Math.hypot(dx,dy)}
async function loadStops(spec){if(spec.anchor){spec.ids=[spec.anchor];return}
 const u='/stops?'+new URLSearchParams({'filter[route]':spec.route,'page[limit]':'500'});
 const response=await request(u);const stops=response.data.filter(x=>x.attributes?.latitude!=null);
 // Find stop named for the user's intersection. Look for the opposite-side stop nearby.
 const anchors=stops.filter(s=>s.attributes.name.toLowerCase().includes(spec.find));
 if(!anchors.length){spec.ids=[];spec.problem='Intersection not found in current MBTA stop list';return}
 const primary=anchors[0];let selected=anchors.slice();
 if(selected.length<2){const nearby=stops.filter(x=>x.id!==primary.id).map(x=>({...x,meters:distance(primary.attributes,x.attributes)})).filter(x=>x.meters<=150).sort((a,b)=>a.meters-b.meters);if(nearby.length)selected.push(nearby[0])}
 spec.ids=[...new Set(selected.map(s=>s.id))];spec.stopNames=selected.map(s=>s.attributes.name);
}
async function initialize(){
 const results=await Promise.allSettled(specs.map(async(s)=>{const tasks=[loadStops(s),request('/routes/'+encodeURIComponent(s.route))];const [_,route]=await Promise.all(tasks);s.destinations=route.data.attributes.direction_destinations||[];}));
 for(let i=0;i<results.length;i++)if(results[i].status==='rejected'){specs[i].problem=results[i].reason.message;specs[i].ids=specs[i].ids||[]}
}
function countdown(date){const seconds=(new Date(date).getTime()-Date.now())/1000;if(!Number.isFinite(seconds)||seconds < -35)return null;if(seconds<45)return 'Now';return String(Math.ceil(seconds/60))}
function timeMarkup(items){const valid=items.map(x=>({raw:x,t:countdown(x)})).filter(x=>x.t!==null).slice(0,3);if(!valid.length)return '<div class="empty">No live predictions</div>';return valid.map(({t})=>`<div class="time"><div class="num">${t}</div><div class="unit">${t==='Now'?'arriving':'min'}</div></div>`).join('')}
function render(){document.getElementById('clock').textContent=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hour:'numeric',minute:'2-digit'}).format(new Date());const root=document.getElementById('groups');const sections=new Map();for(const s of specs){if(!sections.has(s.group))sections.set(s.group,[]);sections.get(s.group).push(s)}let html='';for(const [title,rows]of sections){html+=`<section class="group"><h2>${escapeHTML(title)}</h2><div class="cards">`;for(const s of rows){for(let dir=0;dir<2;dir++){if(['80','88'].includes(s.route) && /lechmere/i.test(s.destinations?.[dir]||''))continue;const key=s.route+':'+dir;const items=arrivals.get(key)||[];const destination=s.destinations?.[dir] || (s.type==='train'?(dir===0?'Heath Street / Boston':'Medford/Tufts'):'Direction '+(dir+1));html+=`<div class="card"><div class="row"><div class="pill ${s.type==='train'?'train':''}">${escapeHTML(s.badge)}</div><div><div class="dest">${escapeHTML(destination)}</div><div class="stop">${escapeHTML(s.station)}</div><div class="walk">🚶 ~${s.walk?.[dir] ?? "?"} min walk</div></div></div><div class="times">${s.problem?`<div class="empty error">${escapeHTML(s.problem)}</div>`:timeMarkup(items)}</div></div>`}}html+='</div></section>'}root.innerHTML=html;
 const status=document.getElementById('status');status.innerHTML=lastSuccess?`<span class="dot"></span> Updated ${Math.max(0,Math.floor((Date.now()-lastSuccess)/1000))} sec ago`:'<span class="dot"></span> Connecting…';if(lastSuccess&&Date.now()-lastSuccess>120000)status.innerHTML='<span class="error">Connection stale · retrying</span>';
}
async function update(){if(inFlight)return;inFlight=true;try{
 const stops=[...new Set(specs.flatMap(s=>s.ids||[]))];if(!stops.length)throw Error('No stops identified');
 // Query each service separately; parent-station predictions are supported for Green Line.
 const results=await Promise.allSettled(specs.map(async s=>{if(!s.ids?.length)return [];const params=new URLSearchParams({'filter[stop]':s.ids.join(','),'filter[route]':s.route,'page[limit]':'100'});const data=await request('/predictions?'+params);return data.data.map(p=>({route:s.route,dir:p.attributes.direction_id,time:p.attributes.arrival_time||p.attributes.departure_time})).filter(p=>p.time)}));
 arrivals=new Map();results.forEach((r,i)=>{if(r.status==='fulfilled'){specs[i].problem=null;for(const p of r.value){const key=p.route+':'+p.dir;if(!arrivals.has(key))arrivals.set(key,[]);arrivals.get(key).push(p.time)}}else specs[i].problem=r.reason.message});for(const times of arrivals.values())times.sort((a,b)=>new Date(a)-new Date(b));lastSuccess=Date.now();
 }catch(err){document.getElementById('status').textContent=err.message}finally{inFlight=false;render()}}
document.getElementById('retry').addEventListener('click',update);render();initialize().then(update).catch(e=>{document.getElementById('status').textContent=e.message;render()});setInterval(render,15000);setInterval(update,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)update()});
</script></body></html>
